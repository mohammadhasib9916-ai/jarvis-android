name: Build JARVIS Android APK

on:
  push:
    paths:
      - 'jarvis-android-companion-safe.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Extract
        run: |
          rm -rf project
          unzip -o jarvis-android-companion-safe.zip -d project

      - name: Build APK
        run: |
          GRADLEW=$(find project -name "gradlew" | head -1)
          DIR=$(dirname "$GRADLEW")
          echo "Building in $DIR"
          cd "$DIR"
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
