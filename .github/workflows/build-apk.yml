name: Build JARVIS Android APK

on:
  push:
    paths:
      - 'jarvis-android-companion-safe.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Extract
        run: |
          rm -rf project
          unzip -o jarvis-android-companion-safe.zip -d project
          GRADLEW=$(find project -name "gradlew" | head -1)
          DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$DIR" >> $GITHUB_ENV
          echo "Dir: $DIR"
          ls "$DIR/gradle/wrapper/" || echo "wrapper missing"

      - name: Fix Gradle Wrapper Jar
        run: |
          cd ${{ env.PROJECT_DIR }}
          mkdir -p gradle/wrapper
          # Download the missing jar
          curl -L -o gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/v8.7.0/gradle/wrapper/gradle-wrapper.jar
          ls -lh gradle/wrapper/
          chmod +x ./gradlew

      - name: Build APK
        run: |
          cd ${{ env.PROJECT_DIR }}
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
