name: Build JARVIS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
            - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Unzip project
        run: unzip jarvis-android-companion.zip -d project

      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2.1-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.2.1/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: |
          cd project/android-companion
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: project/android-companion/app/build/outputs/apk/debug/app-debug.apk
