name: Build JARVIS Android APK

on:
  push:
    paths:
      - 'jarvis-android-companion-safe.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Clean and Extract
        run: |
          rm -rf project
          mkdir -p project
          unzip -o jarvis-android-companion-safe.zip -d project
          # Find root folder inside project
          ROOT=$(find project -maxdepth 2 -name "build.gradle*" | head -1 | xargs dirname)
          if [ -z "$ROOT" ]; then ROOT=project; fi
          echo "ROOT=$ROOT" >> $GITHUB_ENV
          echo "Project files:"
          ls -R $ROOT | head -100

      - name: Set JARVIS URL - FORCE REPLACE
        run: |
          echo "Before replace - searching:"
          grep -R "replace-with-your-jarvis" $ROOT || echo "not found with https, trying without"
          grep -R "replace-with" $ROOT || true
          
          # Replace in all text files
          grep -RIl "replace-with-your-jarvis-web-app-url" $ROOT | xargs sed -i "s|https://replace-with-your-jarvis-web-app-url|https://jarvis-personal-assistant-6607.ai.studio|g" || true
          grep -RIl "replace-with-your-jarvis-web-app-url" $ROOT | xargs sed -i "s|replace-with-your-jarvis-web-app-url|jarvis-personal-assistant-6607.ai.studio|g" || true
          
          echo "After replace - searching:"
          grep -R "replace-with-your-jarvis" $ROOT || echo "SUCCESS - no placeholder left"
          grep -R "jarvis-personal-assistant-6607" $ROOT || echo "FAILED - new url not found"

      - name: Build APK
        run: |
          cd $ROOT
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-debug-apk
          path: ${{ env.ROOT }}/app/build/outputs/apk/debug/app-debug.apk
